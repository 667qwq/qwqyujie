<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵喵喵</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffebf3;
			background-image: url(./img/2.jpg);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
 
        .cat-image {
            width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
 
        .message {
            font-size:26px;
            color: #333;
            margin-bottom: 20px;
        }
 
        .buttons {
            display: flex;
            gap: 20px; /* 初始间距 */
            align-items: center;
        }
 
        .button {
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
 
        .yes {
            background-color: #ff6b81; /* 粉红色 */
        }
 
        .no {
            background-color: #70a1ff; /* 蓝色 */
        }
 
        .hidden {
            display: none; /* 初始隐藏 */
        }
 
        .final-image {
            width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
 
        .final-message {
            font-size: 28px;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- 主页面内容 -->
    <div id="mainContent">
        <img src="img/1.jpg" alt="1" class="cat-image" id="catImage">
        <div class="message" id="textMsg">喜欢东北雨姐的大汗脚吗</div>
        <div class="buttons">
            <button class="button yes" id="yesButton">喜欢</button>
            <button class="button no" id="noButton">不喜欢</button>
        </div>
    </div>
 
    <!-- “2”页面内容 -->
    <div id="yesContent" class="hidden">
        <img src="img/2.jpg" alt="1" class="final-image">
        <div class="final-message">我直接舔舔舔qwq</div>
    </div>
 
    <!-- “3”页面内容 -->
    <div id="confessionContent" class="hidden">
        <img src="img/3.jpg" alt="表白图片" class="final-image">
        <div class="final-message">爸爸爸爸</div>
    </div>
 
    <script>
        const mainContent = document.getElementById('mainContent');
        const yesContent = document.getElementById('yesContent');
        const confessionContent = document.getElementById('confessionContent');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const buttonsContainer = document.querySelector('.buttons');
        const catImage = document.getElementById('catImage');
        // 获取文字元素
        const textMsg = document.getElementById('textMsg');
        
        let clickCount = 0; // 记录点击次数
        const maxClicks = 5; // 最大点击次数
        let isImageChanged = false; // 标记图片是否已被替换

        // 每次点击不喜欢 切换的文字列表（最多6句，对应0-5次点击）
        const textList = [
            "真的不喜欢吗🥺",
            "再考虑一下嘛~",
            "别这么绝情呀",
            "求求你啦",
            "你会后悔的！",
            "好吧……我认输了"
        ];
       
        yesButton.addEventListener('click', () => {
            mainContent.classList.add('hidden'); // 隐藏主页面
            yesContent.classList.remove('hidden'); 
        });
 
        noButton.addEventListener('click', () => {
            if (!isImageChanged) {
                catImage.src = 'img/1.jpg'; 
                isImageChanged = true; 
            }

            // 每次点击 更换文字
            if(clickCount < textList.length){
                textMsg.textContent = textList[clickCount];
            }
 
            if (clickCount < maxClicks) {
                // 放大“可以”按钮
                const currentYesScale = parseFloat(yesButton.style.transform.replace('scale(', '').replace(')', '')) || 1;
                const newYesScale = currentYesScale + 0.2;
                yesButton.style.transform = `scale(${newYesScale})`;
                yesButton.style.transition = 'transform 0.3s ease';
 
                // 缩小“不要”按钮
                const currentNoScale = parseFloat(noButton.style.transform.replace('scale(', '').replace(')', '')) || 1;
                const newNoScale = currentNoScale - 0.1;
                noButton.style.transform = `scale(${newNoScale})`;
                noButton.style.transition = 'transform 0.3s ease';
 
                // 调整按钮间距
                const currentGap = parseFloat(getComputedStyle(buttonsContainer).gap);
                const newGap = currentGap + 10;
                buttonsContainer.style.gap = `${newGap}px`;
 
                clickCount++;
            } else if (clickCount === maxClicks) {
                mainContent.classList.add('hidden');
                confessionContent.classList.remove('hidden'); 
                clickCount++;
            }
        });
    </script>
</body>
</html>
